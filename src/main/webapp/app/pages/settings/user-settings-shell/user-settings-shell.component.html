<div class="settings-shell">
  <h1 class="settings-title mat-headline-5">Settings</h1>

  <mat-card class="settings-card">
    <mat-card-content class="settings-content">
      <nav class="settings-nav" aria-label="Settings navigation">
        <mat-nav-list>
          <a mat-list-item routerLink="account" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Account
          </a>
          <a mat-list-item routerLink="password" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Password
          </a>
          <a mat-list-item routerLink="menu-preferences" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Menu Preferences
          </a>
          <a
            *ngIf="(navbar$ | async)?.user?.role === 'ROLE_USER'"
            mat-list-item
            routerLink="my-plan-access"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            My Plan &amp; Access
          </a>
          <a
            *ngIf="(navbar$ | async)?.user?.role === 'ROLE_ADMIN'"
            mat-list-item
            routerLink="/user/admin/menu-management"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Menu Management
          </a>
        </mat-nav-list>
      </nav>

      <section class="settings-detail" aria-live="polite">
        <router-outlet></router-outlet>
      </section>
    </mat-card-content>
  </mat-card>
</div>
