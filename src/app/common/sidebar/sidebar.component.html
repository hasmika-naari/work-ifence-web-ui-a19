<div class="sidebar-area transition" [ngClass]="{'active': isToggled}">
  <div class="logo align-items-center" [ngClass]="{'active': isToggled}">
    <img class="small-icon transition" src="images/logo.png" style="height: 35px;width:35px;" alt="logo-icon">
    <img class="big-icon transition" src="images/black-logo.png" alt="logo-icon">
  </div>
  <div class="sidebar-scroll-wrapper">
    <ng-container *ngIf="isToggled; else expandedMenu">
      <div class="sidebar-inner">
        <div class="sidebar-menu">
          <div class="collapsed-rail-scroll">
            <div class="collapsed-rail">
              <ng-container *ngFor="let item of allMenuItems(); trackBy: trackItem">
                <button class="collapsed-section-icon"
                  type="button"
                  [attr.aria-label]="item.title"
                  [matTooltip]="item.locked ? (item.title + ' \u2022 Upgrade required') : item.title"
                  matTooltipPosition="right"
                  [routerLink]="isMenuItemEnabled(item) ? (item.route ?? null) : null"
                  [routerLinkActive]="item.locked ? '' : 'is-active'"
                  [routerLinkActiveOptions]="{ exact: true }"
                  [attr.aria-disabled]="item.locked === true ? true : null"
                  [class.locked]="item.locked === true"
                  (click)="item.locked === true ? onLockedMenuClick(item, $event) : null"
                >
                  <span class="menu-icon-wrap menu-icon-wrap--sm">
                    <i-feather class="sidebar-menu-icon" [name]="item.icon"></i-feather>
                    <mat-icon *ngIf="item.locked" class="menu-lock-badge" aria-hidden="true">lock</mat-icon>
                  </span>
                </button>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #expandedMenu>
      <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
          <div class="sidebar-menu">
            <div class="sidebar-menu-grid">
              <ng-container *ngFor="let item of allMenuItems(); trackBy: trackItem">
                <button class="sidebar-menu-grid-item"
                  type="button"
                  [routerLink]="isMenuItemEnabled(item) ? (item.route ?? null) : null"
                  [routerLinkActive]="item.locked ? '' : 'active'"
                  [routerLinkActiveOptions]="{ exact: true }"
                  [attr.aria-disabled]="item.locked === true ? true : null"
                  [class.locked]="item.locked === true"
                  [matTooltip]="item.locked === true ? (item.title + ' \u2022 Upgrade required') : item.title"
                  matTooltipPosition="right"
                  (click)="item.locked === true ? onLockedMenuClick(item, $event) : null"
                >
                  <span class="menu-icon-wrap menu-icon-wrap--lg">
                    <i-feather [name]="item.icon"></i-feather>
                    <mat-icon *ngIf="item.locked" class="menu-lock-badge" aria-hidden="true">lock</mat-icon>
                  </span>
                  <span class="sidebar-menu-grid-label">{{item.title}}</span>
                </button>
              </ng-container>
            </div>
          </div>
        </div>
      </ng-scrollbar>
    </ng-template>
  </div>
  <div class="collapsed-rail-bottom">
    <button
      class="sidebar-more-apps"
      [ngClass]="{'sidebar-more-apps--expanded': !isToggled}"
      type="button"
      (click)="expandSidebar()"
      aria-label="Show more"
    >
      <mat-icon>apps</mat-icon>
      <span class="sidebar-more-label">{{ isToggled ? 'More' : 'Less' }}</span>
    </button>
  </div>
</div> <!-- .sidebar-area -->
<button class="sidebar-expander" type="button" (click)="toggle()" aria-label="Toggle sidebar"
  [matTooltip]="isToggled ? 'Expand sidebar' : 'Collapse sidebar'" matTooltipPosition="left">
  <svg class="sidebar-toggle-icon" [ngClass]="{ 'is-collapsed': isToggled }" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
    <rect class="frame" x="2" y="2" width="16" height="16" rx="2" />
    <line class="split" x1="8" y1="2" x2="8" y2="18" />
  </svg>
</button>
<div class="sidebar-more-overlay" *ngIf="isMoreOpen" (click)="closeMorePanel()">
  <div class="sidebar-more-panel" (click)="$event.stopPropagation()">
    <div class="sidebar-more-header">
      <span class="sidebar-more-title">All Menu</span>
      <button type="button" class="sidebar-more-close" (click)="closeMorePanel()" aria-label="Close menu">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="sidebar-more-body">
      <ng-container *ngFor="let section of navSections(); trackBy: trackSection">
        <div class="sidebar-more-section">
          <div class="sidebar-more-section-title">{{ section.title }}</div>
          <div class="sidebar-more-grid">
            <ng-container *ngFor="let item of section.items; trackBy: trackItem">
              <a
                class="sidebar-more-item"
                [routerLink]="isMenuItemEnabled(item) ? (item.route ?? null) : null"
                [routerLinkActive]="item.locked ? '' : 'active'"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-disabled]="item.locked === true ? true : null"
                [class.locked]="item.locked === true"
                (click)="item.locked === true ? onLockedMenuClick(item, $event) : closeMorePanel()"
                [matTooltip]="item.locked === true ? (item.title + ' \u2022 Upgrade required') : item.title"
                matTooltipPosition="right"
              >
                <span class="menu-icon-wrap menu-icon-wrap--md">
                  <i-feather [name]="item.icon"></i-feather>
                  <mat-icon *ngIf="item.locked" class="menu-lock-badge" aria-hidden="true">lock</mat-icon>
                </span>
                <span class="sidebar-more-label">{{ item.title }}</span>
              </a>
            </ng-container>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
<!-- Optional overlay to dim the rest of the page when the "More" panel is open -->
<div class="sidebar-overlay" *ngIf="isMoreOpen" (click)="closeMorePanel()"></div>
