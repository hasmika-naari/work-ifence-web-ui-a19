<div
    class="sticky-header"
    [ngClass]="{'header-glossy': isSticky}"
    data-testid="app-navbar"
>
    <div
        class="header-area transition"
        [ngClass]="{'active': isToggled}"
    >
    <div class="d-md-flex align-items-center justify-content-between">
                <div class="header-left-side d-flex align-items-center"></div>
        <div class="header-right-side d-flex align-items-center" style="margin-left:auto;">
            <button mat-icon-button class="header-action" matTooltip="Home" (click)="goHome()" aria-label="Go to Home">
                <mat-icon aria-hidden="true">home</mat-icon>
                <span class="header-action-label">Home</span>
            </button>
            @if (isLoggedIn()) {
                <button mat-icon-button class="header-action" matTooltip="Profile / Account" (click)="openMenuSidenav.emit()" aria-label="Open account options">
                    <mat-icon aria-hidden="true">person</mat-icon>
                    <span class="header-action-label" [textContent]="activeProfileLabel()"></span>
                    <mat-icon class="header-action-caret" aria-hidden="true">expand_more</mat-icon>
                </button>
            } @else {
                <button mat-icon-button matTooltip="Login" (click)="goToLogin()" aria-label="Sign in" data-testid="header-sign-in">
                    <mat-icon>login</mat-icon>
                </button>
            }
        </div>
    </div>
    </div>
</div>
