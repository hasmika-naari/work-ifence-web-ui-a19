<ng-content></ng-content>
<br />
@if (files.length > 0 && showButtons  == true) {
  <button
    mat-raised-button
    [color]="uploadAllColor"
    (click)="uploadAll()"
    >
    {{ uploadAllLabel }}
  </button>
}
@if (files.length > 0 && showButtons == true) {
  <button
    mat-raised-button
    [color]="removeAllColor"
    (click)="removeAll()"
    >
    {{ removeAllLabel }}{{showButtons}}
  </button>
}
