<div
    class="training-course-banner-area"
    [class.dark-training-course-banner-area]="themeService.isDark()"
>
    <div class="container">
        <div class="row  mb-7 pb-5">
            <div class="col-lg-6 col-md-12 ml-20 mr-20">
                <div [class.training-course-banner-content]="!isMobile" [class.training-course-banner-content-mobile]="isMobile">
                    <h1 class="mt-2 fade-in">Resumes <span>Enhanced.</span></h1>
                    <h1 class="mt-2 fade-in" style="animation-delay:0.1s">Applications <span>Managed.</span></h1>
                    <h1 class="mt-2 fade-in" style="animation-delay:0.2s">Careers <span>Reimagined.</span></h1>
                    <p class="fade-in" style="animation-delay:0.3s">Crafting Careers, One Step at a Time! whether you are crafting a standout resume or tracking 
                        job applications, our platform is <span style="font-style:italic;text-decoration: underline">one-stop destination.</span>
                    </p>
                    <div class="option-buttons d-block fade-in" style="animation-delay:0.4s">
                        <button type="button" class="get-started link-button-wifence fade-in" style="animation-delay:0.5s"
                            [routerLink]="['/sign-in']" >
                            Get Started
                        </button>
                        <button type="button" class="dashboard-demo link-button-wifence fade-in" style="animation-delay:0.6s"
                            [routerLink]="['/dashboard-intro']" >
                            Dashboard Demo
                        </button>
                    </div>
                    <!-- <div class="option-buttons d-block mt-7">
                        <i class="bx bx-chevron-down text-3xl show-angle-down" 
                            data-aos="fade-up" data-aos-delay="800" data-aos-duration="1000" data-aos-easing="ease-in-out" (click)="scrollToNextPage()"></i>
                    </div> -->
                </div>
            </div>
            <div class="col-lg-6 col-md-12">
                <div class="training-course-banner-image">
                    <img  src="../../../../assets/img/home/wifence-1.png" alt="image" 
                         data-aos="fade-left" data-aos-delay="200" data-aos-duration="2500" data-aos-easing="ease-in-out" loading="eager" decoding="async" fetchpriority="high">
                </div>
            </div>
        </div>
    </div>
</div>
