<div
  class="training-course-banner-area"
  [class.dark-training-course-banner-area]="themeService.isDark()"
  [ngStyle]="{ background: gradient, padding: bannerPadding }"
  style="position:relative;overflow:hidden;"
  >
  <!-- Dynamic decorative overlays -->
  @for (overlay of overlays; track overlay) {
    <div
      class="gradient-overlay"
                [ngStyle]="{
                    position: 'absolute',
                    top: overlay.top,
                    left: overlay.left,
                    width: overlay.width,
                    height: overlay.height,
                    background: overlay.gradient,
                    opacity: overlay.opacity,
                    borderRadius: '50%',
                    zIndex: overlay.zIndex,
                    filter: 'blur(' + overlay.blur + ')',
                    pointerEvents: 'none'
                }"
    ></div>
  }
  <div class="container">
    <div class="row" [ngClass]="{'align-items-center': !isMobile, 'mb-7 pb-5': !isMobile, 'mb-4 pb-3': isMobile}">
      <!-- Content Column -->
      <div [class]="isMobile ? 'col-12' : (isTablet ? 'col-md-10 col-lg-8 mx-auto' : 'col-lg-6 col-md-12')">
        <div [ngClass]="{'training-course-banner-content': !isMobile, 'training-course-banner-content-mobile': isMobile}" class="text-left">
          <div class="main-banner-heading-group">
            <!-- <div class="icon-col">
            <lucide-icon name="file-text" class="title-icon" [style.width]="'3.6em'" [style.height]="'3.6em'"></lucide-icon>
          </div> -->
          <div class="text-col">
            <div class="heading-main" [ngStyle]="{'font-size': headingFontSize, 'line-height': headingLineHeight}">Resumes</div>
            <div class="accent-next-line">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f05b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="responsive-banner-icon lucide lucide-file-text" style="vertical-align:middle;margin-right:0.15em;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
              <span>Enhanced.</span>
            </div>
          </div>
        </div>
        <div class="main-banner-heading-group">
          <!-- <div class="icon-col">
          <lucide-icon name="clipboard-check" class="title-icon"></lucide-icon>
        </div> -->
        <div class="text-col" style="display: flex; flex-direction: column; justify-content: center;">
          <div class="heading-main" [ngStyle]="{'font-size': headingFontSize, 'line-height': headingLineHeight}" style="animation-delay:0.1s">Applications</div>
          <div class="accent-next-line" style="display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f05b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="responsive-banner-icon lucide lucide-clipboard-check" style="vertical-align:middle;margin-right:0.15em;"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
            <span>Managed.</span>
          </div>
        </div>
      </div>
      <div class="main-banner-heading-group">
        <!-- <div class="icon-col">
        <lucide-icon name="trending-up" class="title-icon"></lucide-icon>
      </div> -->
      <div class="text-col">
        <div class="heading-main" [ngStyle]="{'font-size': headingFontSize, 'line-height': headingLineHeight}" style="animation-delay:0.2s">Careers</div>
        <div class="accent-next-line" style="display: flex; align-items: center;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f05b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="responsive-banner-icon lucide lucide-trending-up" style="vertical-align:middle;margin-right:0.15em;"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span>Reimagined.</span>
        </div>
      </div>
    </div>
    <p class="fade-in" [ngClass]="{'mt-4': isMobile, 'mt-2': isTablet, 'mt-5': isDesktop}" style="animation-delay:0.3s">
      Crafting Careers, One Step at a Time! whether you are crafting a standout resume or tracking
      job applications, our platform is <span style="font-style:italic;text-decoration: underline">one-stop destination.</span>
    </p>

    <!-- Buttons with responsive layout -->
    <div class="option-buttons d-block fade-in"
      [ngClass]="{'mt-3': isMobile, 'mt-4': isTablet, 'text-center': isMobile}"
      style="animation-delay:0.4s">
      <button type="button" class="get-started link-button-wifence fade-in btn-icon gradient-bg-btn"
        [ngClass]="{'w-100': isMobile, 'mx-2': !isMobile}"
        style="animation-delay:0.5s"
        [routerLink]="['/sign-in']" >
        <span class="btn-text">Get Started</span>
        <lucide-icon name="arrow-right" class="btn-icon-right"></lucide-icon>
      </button>
      <!-- Dashboard Demo button removed -->
    </div>

    <!-- Scroll down indicator removed -->
  </div>
</div>

<!-- Image Column - Conditionally positioned -->
<div [class]="isMobile ? 'col-12 mt-4' : isTablet ? 'col-md-12 mt-5' : 'col-lg-6 col-md-12'">
  <div class="training-course-banner-image" [ngClass]="{'text-center': isMobile || isTablet}">
    <img src="../../../../assets/img/home/wifence-1.png" alt="image"
      [ngClass]="{'w-100': isMobile || isDesktop, 'w-90': isTablet}"
      data-aos="fade-left" data-aos-delay="200" data-aos-duration="2500" data-aos-easing="ease-in-out"
      loading="eager" decoding="async" fetchpriority="high">
    </div>
  </div>
</div>
</div>
</div>
