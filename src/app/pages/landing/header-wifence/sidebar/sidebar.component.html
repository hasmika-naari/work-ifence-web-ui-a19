<!-- Start Sidebar Modal -->
<div class="sidebar-modal" [ngClass]="{'sidebar-open': sidebarOpen}">
    <!-- Fallback debug content -->
    <div *ngIf="!userAccount" style="padding:2rem;text-align:center;color:#888;">
        <p>No user profile found.</p>
        <p>Sidebar is open and visible: {{sidebarOpen ? 'Yes' : 'No'}}</p>
    </div>

    <!-- Close button -->
    <button class="sidebar-close-btn" (click)="closeSidebar.emit()" aria-label="Close Sidebar">
        <lucide-icon name="x"></lucide-icon>
    </button>

    <!-- Sidebar content -->
    <div class="sidebar-content">
        <div class="sidebar-header">
            <h2 class="sidebar-title"><a routerLink="/">
                <img src="assets/img/black-logo.png" alt="logo" class="sidebar-logo">
            </a></h2>
            <div *ngIf="userAccount" class="sidebar-profile">
                <div *ngIf="isAutoLoggingIn" class="login-progress-container">
                    <mat-spinner [diameter]="70" [strokeWidth]="4" color="accent"></mat-spinner>
                </div>
                <img *ngIf="!isAutoLoggingIn && userAccount.profileImage" [src]="userAccount.profileImage" alt="Profile" class="profile-img" />
            </div>
        </div>

        <div class="sidebar-body">
            <div class="sidebar-widget" *ngIf="userAccount">
                <h3 class="title">Account</h3>
                <ul>
                    <li><a routerLink="/user/dashboard"><lucide-icon name="layout-dashboard"></lucide-icon> Dashboard</a></li>
                    <li><a routerLink="/user/profile"><lucide-icon name="user"></lucide-icon> My Profile</a></li>
                    <li><a routerLink="/user/settings"><lucide-icon name="settings"></lucide-icon> Settings</a></li>
                </ul>
            </div>

            <div class="sidebar-widget">
                <h3 class="title">Additional Links</h3>
                <ul>
                    <li *ngIf="!userAccount"><a routerLink="/sign-in"><lucide-icon name="log-in"></lucide-icon> Login</a></li>
                    <li *ngIf="!userAccount"><a routerLink="/sign-up"><lucide-icon name="user-plus"></lucide-icon> Register</a></li>
                    <li *ngIf="userAccount"><a (click)="logout()" style="cursor: pointer;"><lucide-icon name="log-out"></lucide-icon> Logout</a></li>
                    <li><a routerLink="/faq"><lucide-icon name="help-circle"></lucide-icon> FAQs</a></li>
                </ul>
            </div>

            <div class="sidebar-widget">
                <h3 class="title">Support</h3>
                <ul class="support-link">
                    <li><a [routerLink]="['/privacy']"><lucide-icon name="shield"></lucide-icon> Privacy Policy</a></li>
                    <li><a [routerLink]="['/terms']"><lucide-icon name="file-text"></lucide-icon> Terms of Service</a></li>
                    <li><a [routerLink]="['/contact-us']"><lucide-icon name="message-circle"></lucide-icon> Contact Us</a></li>
                </ul>
            </div>

            <div class="sidebar-widget">
                <h3 class="title">Connect With Us</h3>
                <ul class="social-list">
                    <li>
                        <a href="https://www.facebook.com/people/Naari-Deals/100088113458576" target="_blank" aria-label="Facebook">
                            <lucide-icon name="facebook"></lucide-icon>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/naarideals/?igshid=YmMyMTA2M2Y%3D" target="_blank" aria-label="Instagram">
                            <lucide-icon name="instagram"></lucide-icon>
                        </a>
                    </li>
                    <li *ngIf="country === 'usa'">
                        <a href="https://chat.whatsapp.com/C3OZtNNrgOg5p2uIoRVhVs" target="_blank" aria-label="WhatsApp">
                            <lucide-icon name="message-circle"></lucide-icon>
                        </a>
                    </li>
                    <li *ngIf="country === 'india'">
                        <a href="https://chat.whatsapp.com/EB8UQJflmNrCq6pvZojsJR" target="_blank" aria-label="WhatsApp">
                            <lucide-icon name="message-circle"></lucide-icon>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<!-- End Sidebar Modal -->
