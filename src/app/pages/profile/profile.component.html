

<mat-sidenav-container class="profile-sidenav-container" autosize style="height: 100vh;">
                                <mat-sidenav #rightEditSidenav position="end" mode="over" [opened]="!hidePanelWindow" [disableClose]="true" style="width: 420px; background: #fff; box-shadow: -2px 0 16px rgba(0,0,0,0.07);">
                                        <div class="sidenav-header" style="display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem 1rem 1.5rem; border-bottom: 1px solid #eee;">
                                                <div class="sidenav-title" style="font-size: 1.2rem; font-weight: 600; color: var(--mainColor);">{{formLabel}}</div>
                                                <button mat-icon-button (click)="closePanelWindow($event)" aria-label="Close">
                                                        <mat-icon>close</mat-icon>
                                                </button>
                                        </div>
                                        <div style="padding: 1.5rem 1.5rem 0 1.5rem;">
                                                <ng-container *ngIf="showBioFormEditor">
                                                        <app-bio-form-editor [formClosed]="formClosed" (actionInProgress)="actionInProgressStarts()" (formSaved)="saveForm()"></app-bio-form-editor>
                                                </ng-container>
                                                <ng-container *ngIf="showLoginFormEditor">
                                                        <app-login-form-editor (actionInProgress)="actionInProgressStarts()" (formSaved)="saveForm()"></app-login-form-editor>
                                                </ng-container>
                                                <ng-container *ngIf="showAddressFormEditor">
                                                        <app-address-form-editor (actionInProgress)="actionInProgressStarts()" (formSaved)="saveForm()"></app-address-form-editor>
                                                </ng-container>
                                        </div>
                                </mat-sidenav>
        <mat-sidenav-content style="height: 100vh; overflow-y: auto;">
                <div class="profile-tabs-container">
                        <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
                                <mat-tab label="Bio Profile">
                                        <ng-template mat-tab-label>
                                                <span class="tab-label"><mat-icon>person</mat-icon> Bio Profile</span>
                                        </ng-template>
                                        <div class="tab-content glass-bg">
                                                <!-- Existing profile content moved here -->
                                                <div class="container-fluid">
                                                        <!-- Left Column -->
                                                        <!-- <div class="p-left-column" [ngClass]="{ 'expanded': !hidePanelWindow, 'collapsed': hidePanelWindow }">
                                                                <div class="ToolboxPanel-module_panelContainer shadow-hover bg-surface " style="max-width: 475px; height: 84vh;">
                                                                        <div class="scrollbar-container full-width ToolboxPanel-module_panelContainerHeight" style="height: auto;">
                                                                                <div class="scrollhost-container">
                                                                                        <p-panel class="sidewindow-panel-pp" [header]="formLabel">
                                                                                                <ng-template pTemplate="icons">
                                                                                                        <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="danger" (click)="closePanelWindow($event)" />
                                                                                                </ng-template>
                                                                                                <app-login-form-editor (actionInProgress)="actionInProgressStarts()" (formSaved)="saveForm()" *ngIf="showLoginFormEditor"></app-login-form-editor>
                                                                                                <app-address-form-editor (actionInProgress)="actionInProgressStarts()" (formSaved)="saveForm()" *ngIf="showAddressFormEditor"></app-address-form-editor>
                                                                                        </p-panel>
                                                                                </div>
                                                                        </div>
                                                                </div>
                                                        </div> -->
                                                        <div class="p-right-column" >
                                                                <div class="resume-editor-content-box center-block mt-2">
                                                                        <div class="resume-editor-wrapper feedback-wrapper relative">
                                                                                <div class="resume-renderer center-resume">
                                                                                        <mat-progress-bar *ngIf="isActionInProgress" style="position: absolute; top: 0px;left: 0px;right: 0px;" mode="indeterminate"></mat-progress-bar>
                                                                                        <section class="user-profile-container" style="padding: 0;border: 0;">
                                                                                                <div class="row">
                                                                                                        <div class="col-12">
                                                                                                                <bio-profile-form (editBio)="showBioFormEditorWindow()"></bio-profile-form>
                                                                                                        </div>
                                                                                                        <div class="col-12">
                                                                                                                <login-profile-form (editLogin)="showLoginFormEditorWindow()"></login-profile-form>
                                                                                                        </div>
                                                                                                        <div class="col-12">
                                                                                                                <address-profile-form (editAddress)="showAddressFormEditorWindow()"></address-profile-form>
                                                                                                        </div>
                                                                                                </div>
                                                                                        </section>
                                                                                </div>
                                                                        </div>
                                                                </div>
                                                        </div>
                                                </div>
                                        </div>
                                </mat-tab>
                                <mat-tab label="Academic Profile">
                                        <ng-template mat-tab-label>
                                                <span class="tab-label"><mat-icon>school</mat-icon> Academic Profile</span>
                                        </ng-template>
                                        <div class="tab-content glass-bg">
                                                <!-- Academic profile content goes here -->
                                                <div class="academic-profile-placeholder">
                                                        <mat-icon>school</mat-icon> Academic profile details will be added here.
                                                </div>
                                        </div>
                                </mat-tab>
                                <mat-tab label="Job Profile">
                                        <ng-template mat-tab-label>
                                                <span class="tab-label"><mat-icon>work</mat-icon> Job Profile</span>
                                        </ng-template>
                                        <div class="tab-content glass-bg">
                                                <!-- Job profile content goes here -->
                                                <div class="job-profile-placeholder">
                                                        <mat-icon>work</mat-icon> Job profile details will be added here.
                                                </div>
                                        </div>
                                </mat-tab>
                        </mat-tab-group>
                </div>
        </mat-sidenav-content>
</mat-sidenav-container>
