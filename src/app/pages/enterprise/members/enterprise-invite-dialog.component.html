<h2 mat-dialog-title>Invite Member</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Username (login)</mat-label>
      <input matInput formControlName="userName" placeholder="e.g. john.doe" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option value="ENTERPRISE_EMPLOYEE">Employee</mat-option>
        <mat-option value="ENTERPRISE_HR">HR</mat-option>
        <mat-option value="ENTERPRISE_MARKETING">Marketing</mat-option>
        <mat-option value="ENTERPRISE_RECRUITER">Recruiter</mat-option>
        <mat-option value="ENTERPRISE_ADMIN">Admin</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Send Invite</button>
</div>
