<h2 mat-dialog-title>Invite Member</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option value="EMPLOYEE">Employee</mat-option>
        <mat-option value="HR">HR</mat-option>
        <mat-option value="MARKETING">Marketing</mat-option>
        <mat-option value="RECRUITER">Recruiter</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Note (optional)</mat-label>
      <textarea matInput rows="3" formControlName="note"></textarea>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Send Invite</button>
</div>
