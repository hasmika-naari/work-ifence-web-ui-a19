<mat-card class="flags-card">
  <mat-card-title>Feature Flags (Frontend-only)</mat-card-title>
  <mat-card-subtitle>
    Overrides are stored in localStorage. Effective access is still gated by entitlements.
  </mat-card-subtitle>

  <div class="flags-actions">
    <button mat-stroked-button color="primary" (click)="exportJson()">
      <mat-icon>content_copy</mat-icon>
      Export
    </button>
    <button mat-stroked-button (click)="importNow()">
      <mat-icon>upload</mat-icon>
      Import
    </button>
    <button mat-raised-button color="warn" (click)="resetAll()">
      <mat-icon>restart_alt</mat-icon>
      Reset to defaults
    </button>
  </div>

  <div class="flags-table">
    <table mat-table [dataSource]="rows()" class="mat-elevation-z0">
      <ng-container matColumnDef="key">
        <th mat-header-cell *matHeaderCellDef>Key</th>
        <td mat-cell *matCellDef="let row">
          <div class="flag-key">{{ row.key }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Enabled</th>
        <td mat-cell *matCellDef="let row">
          <mat-slide-toggle
            [checked]="getEdit(row.key).enabled ?? row.enabled"
            (change)="onToggleEnabled(row.key, $event.checked)">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="rollout">
        <th mat-header-cell *matHeaderCellDef>Rollout %</th>
        <td mat-cell *matCellDef="let row">
          <mat-form-field appearance="outline" class="rollout-field">
            <input
              matInput
              type="number"
              min="0"
              max="100"
              [value]="(getEdit(row.key).rolloutPercent ?? row.rolloutPercent) ?? ''"
              (input)="onRolloutChange(row.key, ($any($event.target).value))"
              placeholder="100" />
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="effective">
        <th mat-header-cell *matHeaderCellDef>Effective for me</th>
        <td mat-cell *matCellDef="let row">
          @if (isEffectiveEnabled(row.key)) {
            <span class="pill pill-on">ON</span>
          } @else {
            <span class="pill pill-off">OFF</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-stroked-button color="primary" (click)="applyRow(row)">
            Apply
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-form-field appearance="outline" class="import-field">
    <mat-label>Import / Export JSON</mat-label>
    <textarea
      matInput
      rows="10"
      [ngModel]="importJson()"
      (ngModelChange)="importJson.set($event)"
      placeholder="Paste config JSON here..."></textarea>
  </mat-form-field>
</mat-card>
