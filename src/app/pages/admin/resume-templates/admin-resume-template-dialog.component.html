<h2 mat-dialog-title>
  @if (mode === 'create') {
    Create Resume Template
  } @else {
    Edit Resume Template
  }
</h2>

<mat-dialog-content class="dialog-content">
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput [formControl]="form.controls.title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Template Key</mat-label>
      <input matInput [formControl]="form.controls.templateKey" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Component Key</mat-label>
      <input matInput [formControl]="form.controls.componentKey" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Version</mat-label>
      <input matInput [formControl]="form.controls.version" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Access Level</mat-label>
      <mat-select [formControl]="form.controls.accessLevel">
        <mat-option value="FREE">FREE</mat-option>
        <mat-option value="BASIC">BASIC</mat-option>
        <mat-option value="PREMIUM">PREMIUM</mat-option>
        <mat-option value="ENTERPRISE">ENTERPRISE</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sort Order</mat-label>
      <input matInput type="number" [formControl]="form.controls.sortOrder" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [formControl]="form.controls.status">
        <mat-option value="ACTIVE">ACTIVE</mat-option>
        <mat-option value="INACTIVE">INACTIVE</mat-option>
        <mat-option value="ARCHIVED">ARCHIVED</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Preview Image URL</mat-label>
      <input matInput [formControl]="form.controls.templateDocUrl" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <input matInput [formControl]="form.controls.category" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Style</mat-label>
      <input matInput [formControl]="form.controls.style" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tags (comma separated)</mat-label>
      <input matInput [formControl]="form.controls.tags" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Config JSON</mat-label>
      <textarea matInput rows="6" [formControl]="form.controls.configJson"></textarea>
    </mat-form-field>

    <mat-slide-toggle [formControl]="form.controls.isDefault">Default Template</mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="confirm()">Save</button>
</mat-dialog-actions>
