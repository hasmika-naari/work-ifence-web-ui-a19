<h2 mat-dialog-title>Extend trial</h2>

<div mat-dialog-content>
  <p class="muted">Extend the trial by a number of days and record a reason.</p>

  <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Days</mat-label>
      <input matInput type="number" [formControl]="form.controls.days" />
      @if (form.controls.days.touched && form.controls.days.invalid) {
        <mat-hint style="color: #d32f2f;">Enter a value between 1 and 365.</mat-hint>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Reason</mat-label>
      <textarea matInput rows="4" [formControl]="form.controls.reason"></textarea>
      @if (form.controls.reason.touched && form.controls.reason.hasError('required')) {
        <mat-hint style="color: #d32f2f;">Reason is required.</mat-hint>
      }
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">Extend</button>
</div>
