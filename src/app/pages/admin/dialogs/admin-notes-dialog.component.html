<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>
  @if (data.message) {
    <p class="muted">{{ data.message }}</p>
  }

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Admin notes</mat-label>
    <textarea
      matInput
      [formControl]="notes"
      rows="4"
      placeholder="Optional notes…"
    ></textarea>
    @if (notes.touched && notes.hasError('required')) {
      <mat-hint style="color: #d32f2f;">Notes are required.</mat-hint>
    }
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</div>
