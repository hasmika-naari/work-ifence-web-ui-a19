<div class="container" [class.is-preview]="isPreview">
  <!-- Always show contact section at the top -->
  <section class="trigger-area resume-contact-us">
  <resume-contact-section [data]="getContactSection()" (editContact)="showContact($event)" (dataChange)="onContactSectionUpdated()" [isFormPanleClosed]="isPreview"></resume-contact-section>
  </section>

  <div *ngIf="addedSections() && addedSections().length" cdkDropList (cdkDropListDropped)="onSectionDrop($event)">
    <ng-container *ngFor="let section of addedSections(); let idx = index; let last = last">
      <section class="trigger-area"
        cdkDrag
        style="margin-bottom:16px;"
        *ngIf="section && section.isAdded && shouldShowSection(section.section) && section.section !== 'CONTACT'"
        [ngClass]="getSectionCssClass(section.section)">
        <div class="section-header">
          <span class="summary-section-title">
            {{getSectionTitle(section.section)}}
          </span>
          <div class="section-actions" *ngIf="!isPreview">
            <!-- Only Move Down for first, only Move Up for last, both for others. For PROJECT, hide move down if last. -->
            <button pButton pTooltip="Move Up" icon="pi pi-arrow-up" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowButton(section.section, 'moveUp')" (click)="moveObjectById(section.section, section.id || '', 'up')"></button>
            <button pButton pTooltip="Move Down" icon="pi pi-arrow-down" class="p-button-rounded p-button-text p-button-sm" *ngIf="section.section !== 'PROJECT' ? shouldShowButton(section.section, 'moveDown') : !last" (click)="moveObjectById(section.section, section.id || '', 'down')"></button>
            <button pButton pTooltip="Edit" icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" 
              *ngIf="shouldShowButton(section.section, 'edit')" 
              (click)="section.section === 'PROFILE_SUMMARY_BULLETED' ? onEditProfileSummaryBulleted() : section.section === 'SKILLS_BY_CATEGORY' ? onEditSkillsByCategory() : editSectionHandler(section.section, section.section === 'PROFILE_SUMMARY' ? getProfileSummarySection() : section.section === 'EDUCATION' ? getSectionItems('EDUCATION') : section.section === 'WORK_EXPERIENCE' ? getSectionItems('WORK_EXPERIENCE') : section.section === 'PROJECT' ? getSectionItems('PROJECT') : null)"></button>
            <button pButton pTooltip="Delete" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowButton(section.section, 'delete')" (click)="removeSection(section.section)"></button>
            <button pButton pTooltip="Add" icon="pi pi-plus" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowButton(section.section, 'add')" (click)="addSectionHandler(section.section)"></button>
          </div>
        </div>
        <ng-container [ngSwitch]="section.section">
          <resume-profile-summary-section
            *ngSwitchCase="'PROFILE_SUMMARY'"
            [data]="section.data"
            [isPreview]="isPreview"
            [canMoveDown]="canMoveSectionDown('PROFILE_SUMMARY')"
            (edit)="onEditProfileSummary()"
            (moveDown)="onMoveDownProfileSummary()"
          ></resume-profile-summary-section>
          <resume-profile-summary-bulleted-section
            *ngSwitchCase="'PROFILE_SUMMARY_BULLETED'"
            [data]="getSectionData('PROFILE_SUMMARY_BULLETED')?.data"
            [isPreview]="isPreview"
            (edit)="onEditProfileSummaryBulleted()"
            (delete)="removeSection('PROFILE_SUMMARY_BULLETED')"
          ></resume-profile-summary-bulleted-section>
          <resume-education-section
            *ngSwitchCase="'EDUCATION'"
            [data]="getSectionItems('EDUCATION')"
            [isPreview]="isPreview"
            (edit)="onEditEducation($event)"
            (delete)="onDeleteEducation($event)"
            (moveUp)="onMoveUpEducation($event)"
            (moveDown)="onMoveDownEducation($event)"
            (dummyEdit)="onEditEducation($event)"
          ></resume-education-section>
          <app-relevant-coursework-section
            *ngSwitchCase="'RELEVANT_COURSEWORK'"
            [courseworkList]="getCourseWorkSection()"
            [resetFormTrigger]="resetCourseworkForm"
            [isPreview]="isPreview"
            (edit)="onEditCoursework($event)"
            (delete)="onDeleteCoursework($event)"
            (moveUp)="onMoveUpCoursework($event)"
            (moveDown)="onMoveDownCoursework($event)"
          ></app-relevant-coursework-section>
          <resume-skills-bullet-points-section
            *ngSwitchCase="'SKILLS_BULLET_POINTS'"
            [skillsBulletPoints]="getSkillsBulletPointsSection()"
            [isPreview]="isPreview"
            (add)="onAddSkills()"
            (edit)="onEditSkills()"
          ></resume-skills-bullet-points-section>
          <resume-skills-category-section
            *ngSwitchCase="'SKILLS_BY_CATEGORY'"
            [items]="section.items || []"
            [isPreview]="isPreview"
            (edit)="onEditSkillsCategoryItem($event)"
            (moveUp)="onMoveUpSkillsCategoryItem($event)"
            (moveDown)="onMoveDownSkillsCategoryItem($event)"
            (deleteItem)="onDeleteSkillsCategoryItem($event)"
          ></resume-skills-category-section>
          <resume-work-experience-section
            *ngSwitchCase="'WORK_EXPERIENCE'"
            [data]="getSectionItems('WORK_EXPERIENCE')"
            [isPreview]="isPreview"
            (edit)="editExperienceItem($event)"
            (delete)="deleteExperienceItem($event)"
            (moveUp)="onMoveUpExperience($event)"
            (moveDown)="onMoveDownExperience($event)"
          ></resume-work-experience-section>
          <resume-project-section
            *ngSwitchCase="'PROJECT'"
            [items]="getSectionItems('PROJECT')"
            [isPreview]="isPreview"
            (moveProjectUp)="onMoveUpProject($event)"
            (moveProjectDown)="onMoveDownProject($event)"
            (editProject)="editProjectItem($event)"
            (deleteProject)="onDeleteProject($event)"
          ></resume-project-section>
          <resume-certifications-section *ngSwitchCase="'CERTIFICATIONS'"
            [certifications]="getSectionItems('CERTIFICATIONS')"
            [isPreview]="isPreview"
            (edit)="onEditCertification($event)"
            (delete)="onDeleteCertification($event)"
            (moveUp)="onMoveUpCertification($event)"
            (moveDown)="onMoveDownCertification($event)"></resume-certifications-section>
          <resume-achievements-section *ngSwitchCase="'ACHIEVEMENTS_BULLET_POINTS'" [achievements]="getAchievementBulletPointsSection() || []" [isPreview]="isPreview"></resume-achievements-section>
          <div *ngSwitchDefault>Section '{{section.section}}' is not supported.</div>
        </ng-container>
      </section>
    </ng-container>
  <footer style="padding-top: 100px;padding-bottom:30px;">
    <div class="row">
      <div class="text-left">
        <p class="company-name-in-footer">www.workifence.com</p>
      </div>
      <div>
      </div>
    </div>
  </footer>
