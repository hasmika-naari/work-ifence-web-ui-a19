<div class="container">
  <!-- Always show contact section at the top -->
  <section class="trigger-area resume-contact-us">
    <resume-contact-section [data]="resumeForm()?.contact || {}" (editContact)="showContact()"></resume-contact-section>
  </section>

  <div cdkDropList [cdkDropListData]="currentSections()" (cdkDropListDropped)="drop($event)">
    <ng-container *ngIf="currentSections() && currentSections().length">
      <ng-container *ngFor="let section of currentSections(); let idx = index; let last = last">
        <section class="trigger-area"
          style="margin-bottom:16px;"
          *ngIf="section && shouldShowSection(section.section) && section.section !== 'CONTACT'"
          [ngClass]="getSectionCssClass(section.section)"
          cdkDrag
          (cdkDragStarted)="dragStarted($event); onDragStart(section.section)"
          (cdkDragEnded)="onDragEnd()">
          <span class="summary-section-title" cdkDragHandle>
            {{getSectionTitle(section.section)}}
            <ng-container *ngIf="!isPreview">
              <div class="section-actions">
                <!-- Only Move Down for first, only Move Up for last, both for others -->
                <button pButton pTooltip="Move Up" icon="pi pi-arrow-up" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowMoveButtons(section.section) && section.canMoveUp" (click)="moveObjectById(section.section, section.id || '', 'up')"></button>
                <button pButton pTooltip="Move Down" icon="pi pi-arrow-down" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowMoveButtons(section.section) && section.canMoveDown" (click)="moveObjectById(section.section, section.id || '', 'down')"></button>
                <button pButton pTooltip="Edit" icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowEditButton(section.section)" (click)="editSectionHandler(section.section, section.section === 'PROFILE_SUMMARY' ? resumeForm()?.profileSummary : section.section === 'EDUCATION' ? resumeForm()?.education : section.section === 'WORK_EXPERIENCE' ? resumeForm()?.experience : section.section === 'PROJECT' ? resumeForm()?.project : null)"></button>
                <button pButton pTooltip="Delete" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowDeleteButton(section.section)" (click)="removeSection(section.section)"></button>
                <button pButton pTooltip="Add" icon="pi pi-plus" class="p-button-rounded p-button-text p-button-sm" *ngIf="shouldShowAddButton(section.section)" (click)="addSectionHandler(section.section)"></button>
              </div>
            </ng-container>
          </span>
            <ng-container [ngSwitch]="section.section">
              <resume-profile-summary-section *ngSwitchCase="'PROFILE_SUMMARY'" [data]="resumeForm()?.profileSummary || {}"></resume-profile-summary-section>
              <resume-education-section
                *ngSwitchCase="'EDUCATION'"
                [data]="resumeForm()?.education || []"
                (edit)="onEditEducation($event)"
                (delete)="onDeleteEducation($event)"
                (dummyEdit)="onEditEducation($event)"
              ></resume-education-section>
              <app-relevant-coursework-section *ngSwitchCase="'RELEVANT_COURSEWORK'" [courseworkList]="resumeForm()?.courseWork || []"></app-relevant-coursework-section>
              <resume-skills-bullet-points-section *ngSwitchCase="'SKILLS_BULLET_POINTS'" [skills]="resumeForm()?.skill_v2 || []"></resume-skills-bullet-points-section>
              <resume-skills-category-section *ngSwitchCase="'SKILLS_CATEGORY'" [skills]="resumeForm()?.skill_v2 || []"></resume-skills-category-section>
              <resume-work-experience-section *ngSwitchCase="'WORK_EXPERIENCE'" [data]="resumeForm()?.experience || []"></resume-work-experience-section>
              <resume-project-section *ngSwitchCase="'PROJECT'" [data]="resumeForm()?.project || []"></resume-project-section>
              <resume-certifications-section *ngSwitchCase="'CERTIFICATIONS'" [data]="resumeForm()?.certification || []"></resume-certifications-section>
              <resume-achievements-section *ngSwitchCase="'ACHIEVEMENTS_BULLET_POINTS'" [data]="resumeForm()?.achievementBulletPoints || []"></resume-achievements-section>
              <div *ngSwitchDefault>Section '{{section.section}}' is not supported.</div>
            </ng-container>
        </section>
      </ng-container>
    </ng-container>
  </div>
  <footer style="padding-top: 100px;padding-bottom:30px;">
    <div class="row">
      <div class="text-left">
        <p class="company-name-in-footer">www.workifence.com</p>
      </div>
      <div>
      </div>
    </div>
  </footer>
