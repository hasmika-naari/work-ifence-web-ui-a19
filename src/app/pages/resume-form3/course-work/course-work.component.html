<div class="resume-form-container">
    <form [formGroup]="courseWorkForm">
        
        <div class="form-row form-row--single">
            <div class="field">
                <label for="section_title">Section Title *</label>
                <input 
                    id="section_title" 
                    type="text" 
                    pInputText 
                    #role 
                    formControlName="section_title" 
                    placeholder="Enter section title"
                />
                <small class="error" *ngIf="courseWorkForm.get('section_title')?.hasError('required') && (courseWorkForm.get('section_title')?.dirty || courseWorkForm.get('section_title')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-row form-row--single">
            <div class="field">
                <label for="coursework">Course Name</label>
                <input 
                    id="coursework" 
                    type="text" 
                    pInputText 
                    formControlName="coursework" 
                    placeholder="Enter course name"
                />
            </div>
        </div>

        <div class="form-row form-row--single">
            <div class="field">
                <label for="institution">Institution/Organization</label>
                <input 
                    id="institution" 
                    type="text" 
                    pInputText 
                    formControlName="institution" 
                    placeholder="Enter institution or organization"
                />
            </div>
        </div>

        <div class="form-row form-row--single" *ngIf="fruits && fruits.length > 0 && !isEditMode">
            <div class="field">
                <label>Added Courses</label>
                <div class="course-work-list">
                    <div
                      *ngFor="let fruit of fruits"
                      class="course-work-item">
                      <div class="course-work-content">
                        <div class="course-name">{{fruit.courseworkname}}</div>
                        <div class="course-institution" *ngIf="fruit.institution">{{fruit.institution}}</div>
                      </div>
                      <button 
                        type="button"
                        class="remove-btn"
                        (click)="remove(fruit)"
                        title="Remove course">
                        <i class="pi pi-times"></i>
                      </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button 
                type="button" 
                class="action-btn action-btn--primary" 
                (click)="saveAndContinue()"
                [disabled]="courseWorkForm.invalid || (!hasFormChanged && !isEditMode) || (isEditMode && !isFormDirty())"
                [matTooltip]="getButtonTooltip()"
                tooltipPosition="top">
                <i class="pi" [ngClass]="isEditMode ? 'pi-check' : 'pi-check'"></i>
                {{isEditMode ? 'Update Course Work' : 'Add Course Work'}}
            </button>
        </div>
    </form>
</div>
