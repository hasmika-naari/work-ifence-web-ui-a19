<div class="resume-form-container">
    <div class="col-12">
        <form [formGroup]="summaryForm">
            <div class="form-row form-row--single">
                <div class="field">
                    <label for="experience">Experience In Years</label>
                    <p-dropdown 
                        id="experience" 
                        formControlName="experience_level"
                        [options]="experienceOptions" 
                        placeholder="Select Experience Level"
                        optionLabel="label"
                        optionValue="value"
                        styleClass="compact-dropdown"
                        [showClear]="false">
                    </p-dropdown>
                </div>
                <div class="field editor-wrapper">
                    <div class="label-with-action">
                        <label for="profile_summary">Job Description</label>
                        <div class="botbro-action">
                            @if(!is_summary_loading){
                                <button type="button" class="botbro-btn" (click)="optimizeText()">
                                    <i class="pi pi-sparkles"></i>
                                    <span>MATCH</span>
                                </button>
                            }
                            @if(is_summary_loading){
                                <button type="button" class="botbro-btn botbro-btn--loading">
                                    <div class="progress-container">
                                        <div class="progress-bar"></div>
                                        <span>PROCESSING...</span>
                                    </div>
                                </button>
                            }
                        </div>
                    </div>
                    <div class="editor-container">
                        <div class="NgxEditor__Wrapper">
                            <ngx-editor-menu 
                                [editor]="editor!" 
                                [toolbar]="toolbar">
                            </ngx-editor-menu>
                            <ngx-editor 
                                [editor]="editor!" 
                                formControlName="profile_summary"
                                [placeholder]="'Enter job description here...'"
                                [spellcheck]="true">
                            </ngx-editor>
                        </div>
                    </div>
                    <small class="hint-text">Note: Use Job description to find skills and ATS keywords.</small>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Toast component for error/success messages -->
<p-toast></p-toast>
