<div class="resume-form-container" style="background: rgba(255,255,255,0); border-radius: 18px; box-shadow: none; padding: 2rem 1.5rem; max-width: 540px; margin: 2rem auto;">
  <form [formGroup]="skillsForm" (ngSubmit)="$event.preventDefault()">
    <div class="form-row form-row--single" style="margin-bottom: 1.2rem;">
      <div class="field">
        <label for="section_title">Section Title <span class="required">*</span></label>
        <input id="section_title" type="text" pInputText formControlName="section_title" placeholder="e.g. Skills by Category" style="background: rgba(255,255,255,0.7);">
      </div>
    </div>
    <ng-container *ngIf="sectionName !== 'SKILLS_BULLET_POINTS'; else bulletedSkills">
      <div class="form-row form-row--single" style="margin-bottom: 1.2rem;">
        <div class="field">
          <label for="sub_title">Category <span class="required">*</span></label>
          <input id="sub_title" type="text" pInputText formControlName="sub_title" placeholder="Category" [matAutocomplete]="categoryAuto" (input)="onCategoryInput($event)" #categoryInput style="background: rgba(255,255,255,0.7);">
          <mat-autocomplete #categoryAuto="matAutocomplete" class="section-autocomplete" [autoActiveFirstOption]="false">
            <mat-option *ngFor="let option of filteredOptions | async" [value]="option">{{option}}</mat-option>
          </mat-autocomplete>
        </div>
      </div>
      <div class="form-row form-row--single" style="margin-bottom: 1.2rem;">
        <div class="field">
          <label for="skills">Add Skill</label>
          <div style="display: flex; align-items: center; width: 100%;">
            <input id="skills" type="text" pInputText formControlName="skills" placeholder="Type a skill and press Enter" (keydown.enter)="addSkillToCategory($event)"
              [ngClass]="['add-skill-input', skillsForm.get('skills')?.value?.trim() ? 'has-content' : '']"
              style="background: rgba(255,255,255,0.7); flex: 1 1 auto; height: 44px; box-shadow: none; outline: none;">
            <button *ngIf="skillsForm.get('skills')?.value?.trim()" type="button" class="add-skill-btn text-btn" (click)="addSkillToCategory($event)" style="height: 44px; width: 56px; border-radius: 0 6px 6px 0; background: rgba(255,255,255,0.7); color: #f05b45; border: 1px solid #b6c6e3; border-left: none; display: flex; align-items: center; justify-content: center; font-size: 1em; font-weight: 600; cursor: pointer; box-shadow: none; outline: none; transition: box-shadow 0.2s, border-color 0.2s, background 0.2s, color 0.2s;">
              Add
            </button>
          </div>
          <style>
            input#skills:focus, input#section_title:focus, input#sub_title:focus {
              box-shadow: 0 0 0 2px #e0eaff;
              border-color: #7da7f7;
              z-index: 2;
            }
            .add-skill-btn.text-btn:focus {
              box-shadow: 0 0 0 2px #e0eaff;
              border-color: #7da7f7;
              z-index: 2;
            }
            .add-skill-btn.text-btn:hover {
              background: #f05b45;
              color: #fff;
              border-color: #f05b45;
            }
          </style>
        </div>
      </div>
      <div class="form-row form-row--single">
        <div class="field">
          <label>Added Skills</label>
          <div class="skills-chips-container" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="onSkillsReordered($event)">
            <ng-container *ngIf="selectedCategory && selectedCategory.skills && selectedCategory.skills.length > 0; else emptySkills">
              <div *ngFor="let skill of selectedCategory.skills; let i = index" class="skill-chip" cdkDrag>
                <span class="skill-text">{{skill}}</span>
                <button type="button" class="remove-btn" (click)="removeSkill(selectedCategory, skill)" title="Remove skill">
                  <i class="pi pi-times"></i>
                </button>
                <div *cdkDragPlaceholder class="skill-chip-placeholder">{{skill}}</div>
              </div>
            </ng-container>
            <ng-template #emptySkills>
              <div class="empty-skills-message" style="color: #b0b0b0; font-size: 0.98em; padding: 0.7em 0;">No skills added yet. Add skills above and drag to reorder.</div>
            </ng-template>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #bulletedSkills>
      <!-- Bulleted skills form goes here -->
      <div class="form-row form-row--single" style="margin-bottom: 1.2rem;">
        <div class="field">
          <label for="skills">Add Skill</label>
          <div style="display: flex; align-items: center; width: 100%;">
            <input id="skills" type="text" pInputText formControlName="skills" placeholder="Type a skill and press Enter" (keydown.enter)="addSkillBulletPoint()"
              [ngClass]="['add-skill-input', skillsForm.get('skills')?.value?.trim() ? 'has-content' : '']"
              style="background: rgba(255,255,255,0.7); flex: 1 1 auto; height: 44px; box-shadow: none; outline: none;">
            <button *ngIf="skillsForm.get('skills')?.value?.trim()" type="button" class="add-skill-btn text-btn" (click)="addSkillBulletPoint()" style="height: 44px; width: 56px; border-radius: 0 6px 6px 0; background: rgba(255,255,255,0.7); color: #f05b45; border: 1px solid #b6c6e3; border-left: none; display: flex; align-items: center; justify-content: center; font-size: 1em; font-weight: 600; cursor: pointer; box-shadow: none; outline: none; transition: box-shadow 0.2s, border-color 0.2s, background 0.2s, color 0.2s;">
              Add
            </button>
          </div>
        </div>
      </div>
      <div class="form-row form-row--single">
        <div class="field">
          <label>Added Skills</label>
          <div class="skills-chips-container" cdkDropList cdkDropListOrientation="vertical" (cdkDropListDropped)="onSkillsReordered($event)">
            <ng-container *ngIf="skillsBulletPoints && skillsBulletPoints.length > 0; else emptyBulletedSkills">
              <div *ngFor="let skill of skillsBulletPoints; let i = index" class="skill-chip" cdkDrag>
                <span class="skill-text">{{skill}}</span>
                <button type="button" class="remove-btn" (click)="removeSkillBulletPoint(i)" title="Remove skill">
                  <i class="pi pi-times"></i>
                </button>
                <div *cdkDragPlaceholder class="skill-chip-placeholder">{{skill}}</div>
              </div>
            </ng-container>
            <ng-template #emptyBulletedSkills>
              <div class="empty-skills-message" style="color: #b0b0b0; font-size: 0.98em; padding: 0.7em 0;">No skills added yet. Add skills above and drag to reorder.</div>
            </ng-template>
          </div>
        </div>
      </div>
    </ng-template>
    <div class="form-actions" style="margin-top: 2rem; text-align: right;">
      <button type="button" class="action-btn action-btn--primary" (click)="saveAndContinue()" [disabled]="skillsForm.invalid || (sectionName !== 'SKILLS_BULLET_POINTS' && (!selectedCategory || !selectedCategory.skills.length)) || (sectionName === 'SKILLS_BULLET_POINTS' && !skillsBulletPoints.length)" [matTooltip]="getButtonTooltip()" tooltipPosition="top">
        <i class="pi pi-check"></i>
        Save Skills
      </button>
    </div>
  </form>
</div>
