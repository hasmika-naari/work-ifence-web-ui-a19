<div class="resume-form-container">
    <form [formGroup]="achievementsForm">
        
        <div class="form-row form-row--single">
            <div class="field">
                <label for="section_title">Section Title *</label>
                <input 
                    id="section_title" 
                    type="text" 
                    pInputText 
                    #role 
                    formControlName="section_title" 
                    placeholder="e.g., Achievements"
                />
                <small class="error" *ngIf="achievementsForm.get('section_title')?.hasError('required') && (achievementsForm.get('section_title')?.dirty || achievementsForm.get('section_title')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-row form-row--single experiance-description">
            <div class="field">
                <label for="description">Achievements</label>
                <div id="editorContainer" #editorContainer></div>
            </div>
        </div>

        <div class="form-actions">
            <button 
                type="button" 
                class="action-btn action-btn--primary" 
                (click)="saveAndContinue()"
                matTooltip="Add to Resume"
                tooltipPosition="top">
                <i class="pi pi-check"></i>
                Add to Resume
            </button>
        </div>
    </form>
</div>
