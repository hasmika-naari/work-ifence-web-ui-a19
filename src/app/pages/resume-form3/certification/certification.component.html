<div class="resume-form-container">
    <form [formGroup]="certifyForm">
        
        <div class="form-row form-row--single">
            <div class="field">
                <label for="section_title">Section Title *</label>
                <input 
                    id="section_title" 
                    type="text" 
                    pInputText 
                    #role 
                    formControlName="section_title" 
                    placeholder="e.g., Certifications"
                />
                <small class="error" *ngIf="certifyForm.get('section_title')?.hasError('required') && (certifyForm.get('section_title')?.dirty || certifyForm.get('section_title')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-row form-row--single">
            <div class="field">
                <label for="certification_name">Certification Name *</label>
                <input 
                    id="certification_name" 
                    type="text" 
                    pInputText 
                    formControlName="certification_name" 
                    placeholder="e.g., AWS Certified Solutions Architect"
                />
                <small class="error" *ngIf="certifyForm.get('certification_name')?.hasError('required') && (certifyForm.get('certification_name')?.dirty || certifyForm.get('certification_name')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-row form-row--single">
            <div class="field">
                <label for="issued_organisation">Issued Organisation *</label>
                <input 
                    id="issued_organisation" 
                    type="text" 
                    pInputText 
                    formControlName="issued_organisation" 
                    placeholder="e.g., Amazon Web Services"
                />
                <small class="error" *ngIf="certifyForm.get('issued_organisation')?.hasError('required') && (certifyForm.get('issued_organisation')?.dirty || certifyForm.get('issued_organisation')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-row form-row--single">
            <div class="field">
                <label for="certification_link">Certification Link</label>
                <input 
                    id="certification_link" 
                    type="url" 
                    pInputText 
                    formControlName="certification_link" 
                    placeholder="https://..."
                />
                <small class="error" *ngIf="certifyForm.get('certification_link')?.hasError('required') && (certifyForm.get('certification_link')?.dirty || certifyForm.get('certification_link')?.touched)">
                    Required.
                </small>
                <small class="error" *ngIf="certifyForm.get('certification_link')?.hasError('pattern') && (certifyForm.get('certification_link')?.dirty || certifyForm.get('certification_link')?.touched)">
                    Please enter a valid link.
                </small>
            </div>
        </div>

        <div class="form-row form-row--double">
            <div class="field">
                <label for="issued_month">Issued Month</label>
                <p-dropdown 
                    id="issued_month"
                    formControlName="issued_month"
                    [options]="months"
                    optionLabel="title"
                    optionValue="title"
                    placeholder="Select Month">
                </p-dropdown>
            </div>

            <div class="field">
                <label for="issued_year">Year *</label>
                <p-dropdown 
                    id="issued_year"
                    formControlName="issued_year"
                    [options]="yearOptions"
                    placeholder="Select Year"
                    [filter]="true"
                    filterBy="label">
                </p-dropdown>
                <small class="error" *ngIf="certifyForm.get('issued_year')?.hasError('required') && (certifyForm.get('issued_year')?.dirty || certifyForm.get('issued_year')?.touched)">
                    Required.
                </small>
            </div>
        </div>

        <div class="form-actions">
            <button 
                type="button" 
                class="action-btn action-btn--primary" 
                (click)="saveAndContinue()" 
                [disabled]="certifyForm.invalid || !hasFormChanged"
                [matTooltip]="getButtonTooltip()"
                tooltipPosition="top">
                <i class="pi pi-check"></i>
                Add to Resume
            </button>
        </div>
    </form>
</div>
