    <div class="add-section-form-container">
      <div class="card-grid" role="list">
        <mat-card class="custom-card" *ngFor="let item of add_sections; trackBy: trackBySection" role="listitem">
          <div class="image-container">
            <div class="svg-background" [innerHTML]="getSectionSvgIllustration(item.section)"></div>
            
            <!-- Fallback Icon -->
            <div class="icon-fallback">
              <i [class]="'pi ' + getSectionIcon(item.section)" 
                [style.color]="getSectionColor(item.section)"></i>
            </div>
            
            <!-- Centered Button -->
            <div class="overlay" (click)="addSection(item)" 
                (keydown)="onOverlayKeydown($event, item)"
                tabindex="0"
                role="button"
                [attr.aria-label]="'Add ' + item.title + ' section to resume'">
              <div class="overlay-button">
                <i class="pi pi-plus"></i>
                Add to resume
              </div>
            </div>
          </div>
          
          <mat-card-content>
            <h3 class="card-title">{{ item.title }}</h3>
          </mat-card-content>
        </mat-card>
      </div>
    </div>

</div> -->
