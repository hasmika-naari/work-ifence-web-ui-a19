<div class="resume-form-container summary-flex-layout">
    <div class="col-12">
        <form [formGroup]="summaryForm" style="display: flex; flex-direction: column; height: 80vh;">

            <div class="form-row form-row--single" style="flex: 1 1 auto; display: flex; flex-direction: column;">
                <div class="field">
                    <label for="section_title">Section title <span class="required">*</span></label>
                    <input id="section_title" type="text" pInputText #role formControlName="section_title" placeholder="Section Title">
                    <small class="error" *ngIf="summaryForm.get('section_title')?.hasError('required') && summaryForm.get('section_title')?.touched">
                        Required.
                    </small>
                </div>
                <div class="field">
                    <label for="summaryFormat">Summary Format</label>
                                                            <p-dropdown id="summaryFormat" formControlName="format"
                                                                    [options]="[
                                                                        { label: 'Paragraph', value: 'paragraph' },
                                                                        { label: 'Bulleted', value: 'bulleted' }
                                                                    ]"
                                                                    optionLabel="label"
                                                                    optionValue="value"
                                                                    placeholder="Select Format"
                                                                    styleClass="p-inputtext summary-format-dropdown"
                                                                    [size]="'small'"
                                                            ></p-dropdown>
                </div>
                <div class="field" style="flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                        <label style="margin-bottom: 0;">Summary</label>
                        <span>
                            <button class="d-flex ai-btn" (click)="optimizeText()" *ngIf="!is_summary_loading">
                                <p-icon class="pi pi-sparkles" style="font-size: medium;margin-right: 5px;"></p-icon> USE BOTBRO
                            </button>
                            <button class="d-flex ai-btn" disabled *ngIf="is_summary_loading">
                                <div class="progress-container">
                                    <div class="progress-bar"></div>
                                    <p-icon class="pi pi-sparkles pi-sparkles-pos"></p-icon>
                                </div>
                                USE BOTBRO
                            </button>
                        </span>
                    </div>
                    <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;">
                        <p-editor formControlName="profile_summary" [style]="{flex: '1 1 0', minHeight: '320px', maxHeight: 'none', height: '100%'}" styleClass="summary-editor"></p-editor>
                    </div>
                </div>
            </div>

            <div class="form-actions" style="margin-top: 0; padding-top: 0;">
                <button 
                    type="button" 
                    class="action-btn action-btn--primary" 
                    (click)="saveAndContinue()" 
                    [disabled]="isButtonDisabled || is_summary_loading || summaryForm.invalid || !hasFormChanged"
                    [title]="getButtonTooltip()"
                >
                    <i class="pi pi-check"></i>
                    {{ hasFormChanged ? 'Update Resume' : 'Add to Resume' }}
                </button>
            </div>
        </form>
    </div>
</div>
<div class="summary-ai-animated-panel" 
            [style.width]="width + 'px'" [style.border-width]="borderWidth + 'px'">
     <div class="summary-ai-response-panel-pp" header="">
        <div  class="row" style="height: 50px;">
            <div class="col-9" style="display: flex;justify-content: flex-start;align-items: center;">
                <h3 style="margin-top: 0;
                    color: #333;
                    font-size: 1rem;margin-left: 15px;">AI Response</h3>
            </div>
            <div class="col-3">
                <div class="position-close-icon">
                    <p-button icon="pi pi-times"   
                    [rounded]="true" [text]="true" severity="danger"
                 (click)="closePanelWindow()" />
                </div>
              
            </div>
        </div>
        <div style="position: relative;top:10px;height:71vh;margin-left:10px;margin-right:10px;">
            @if(summaryAIResponses.length > 0){
                <div class="col-12 p-b-1 p-t-2" style="position: absolute;top:0px;bottom:0px;">
                    <mat-card class="ai-response-panel">
                            @if(action_taken == ''){
                                <div class="section-actions">
                                    <p-icon class="pi pi-pencil" title="Edit" (click)="editAIResponse()"></p-icon>
                                    <p-icon class="pi pi-sparkles pi-sparkles-pos" title="Use BotBro" (click)="reoptimizeSummary()"></p-icon>
                                    <p-icon class="pi pi-plus" title="Use This Response" (click)="setAIResponse()" ></p-icon>
                                  </div>
                            }
                            @if(action_taken != 'EDIT'){
                                <p [ngClass]="action_taken == 'OPTIMIZE'? 'spinner-wrapper' : ''">{{ summaryAIResponses }}</p>
                            }
                            @if(action_taken == 'OPTIMIZE'){
                                <div class="spinner-overlay">
                                    <div class="spinner"></div>
                                </div>
                            }
                            @else if(action_taken == 'EDIT'){
                                <mat-form-field appearance="outline">
                                    <textarea matInput [formControl]="aiResponsePoint"></textarea>
                                </mat-form-field>
                                <div style="display: flex;justify-content: space-between;align-items: center;">
                                    <button mat-button color="warn" (click)="cancelPoint()">Cancel</button>
                                    <button mat-stroked-button color="primary" (click)="updatePoint()">Update</button>
                                </div>
                            }
                    </mat-card>
                </div>
            }
        </div>
    </div>
</div>

<!-- Toast component for error/success messages -->
<p-toast></p-toast>
