<div class="dialog-overlay" id="dialogOverlay">
  <!-- Dialog Box -->
  <div class="dialog-box">
    <!-- Top-right close (X) -->
    <button mat-icon-button class="dialog-close" aria-label="Close" (click)="onCancelClick()" disableRipple>
      <mat-icon>close</mat-icon>
    </button>

    <mat-dialog-content>
      <h2 class="dialog-title">Save Changes?</h2>
      <p class="dialog-message">
        Do you want to save the changes you made? Your changes will be lost if you don’t save them.
      </p>
    </mat-dialog-content>
    <div class="dialog-buttons">
      <mat-dialog-actions>
        <!-- Neutral cancel just closes the dialog -->
        <button mat-button class="btn cancel" (click)="onCancelClick()">Cancel</button>
        <!-- Explicit discard (red) -->
        <button mat-button class="btn delete" (click)="onNoClick()">Discard Changes</button>
        <!-- Save changes (primary/green) -->
        <button mat-raised-button class="btn save" (click)="onConfirmHandler()" cdkFocusInitial>
          Save Changes
        </button>
      </mat-dialog-actions>
    </div>
  </div>
</div>
