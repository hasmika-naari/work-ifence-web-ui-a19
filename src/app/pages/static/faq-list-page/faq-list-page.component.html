<div style="position: fixed;top:0px;bottom:0px;left:0px;right:0px;overflow-y:auto;overflow-x:hidden;" #pageSection>
  <div #sentinel></div>
  <app-header-wifence [isSticky]="isSticky"></app-header-wifence>
  
  <div class="faq-area" [class.dark-faq-area]="themeService.isDark()">
    <div class="container">
      <div class="row g-5">
        <div class="story-content">
          <!-- Modern Title Section -->
          <div class="modern-title-section">
            <div class="title-wrapper">
              <div class="navigation-buttons">
                <a class="nav-button home-button" [routerLink]="['/']">
                  <lucide-icon name="home"></lucide-icon>
                  Home
                </a>
                <a class="nav-button back-button" (click)="goBack($event)">
                  <lucide-icon name="undo2"></lucide-icon>
                  Back
                </a>
              </div>
              <h1 class="faq-title">Frequently Asked Questions</h1>
            </div>
          </div>
          
          <!-- FAQ Sections with Angular Material Accordion -->
          <div class="faq-sections">
            <div *ngFor="let section of faqSections; let sectionIndex = index" class="faq-section">
              <h4 class="title">{{ section.title }}</h4>
              
              <mat-accordion class="faq-accordion" multi>
                <mat-expansion-panel 
                  *ngFor="let faq of section.faqs; let faqIndex = index" 
                  [expanded]="faq.expanded"
                  (opened)="toggleFaq(sectionIndex, faqIndex)"
                  class="faq-item"
                  [class.active]="faq.expanded">
                  
                  <mat-expansion-panel-header>
                    <mat-panel-title>
                      {{ faq.question }}
                    </mat-panel-title>
                  </mat-expansion-panel-header>
                  
                  <div class="faq-content">
                    <p [innerHTML]="faq.answer"></p>
                  </div>
                </mat-expansion-panel>
              </mat-accordion>
            </div>
          </div>

          <!-- Contact CTA Section -->
          <div class="contact-section">
            <h4 class="title">Still have questions?</h4>
            <p>
              If you cannot find an answer to your question in our FAQ, you can always contact us. 
              We will answer to you shortly!
            </p>
            
            <div class="action-buttons">
              <a [routerLink]="['/contact']" class="btn-primary">Contact Us</a>
              <a [routerLink]="['/support']" class="btn-secondary">Visit Support Center</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-work-ifence-footer></app-work-ifence-footer>
</div>
