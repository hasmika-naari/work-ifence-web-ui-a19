<div class="job-tracker">
  <div class="resume-container">
    <header #resumeHeader class="resume-header" [class.is-stuck]="isHeaderStuck">
      <div class="resume-header__title">
        <h1 class="title">Resume Tracker</h1>
        <p class="subtitle">Create, organize, and tailor resumes for each role.</p>
      </div>
    </header>

    <div class="resume-controls">
      <div class="resume-controls__filters">
        <p-select
          [options]="resumeCategories"
          [formControl]="filteredResumeCategoryValue"
          [checkmark]="true"
          optionLabel="name"
          placeholder="Resume Category"
          [disabled]="isActionInProgress"
        ></p-select>
        <p-select
          [options]="roleCategories"
          [formControl]="filteredRoleCategoryValue"
          [checkmark]="true"
          optionLabel="name"
          placeholder="Role Category"
          [disabled]="isActionInProgress"
        ></p-select>

        <div class="search-container">
          <i class="pi pi-search" aria-hidden="true"></i>
          <input
            type="text"
            class="search-input"
            placeholder="Search resume by title"
            [formControl]="searchQuery"
          />
        </div>

        @if (hasActiveFilters()) {
          <button
            class="link-btn"
            type="button"
            (click)="resetFilters()"
            [disabled]="isActionInProgress"
          >
            <i class="pi pi-times" aria-hidden="true"></i>
            <span>Clear filters</span>
          </button>
        }
      </div>

      <div class="resume-controls__meta">
        <button class="add-job-btn" (click)="onAddResume()" [disabled]="isActionInProgress">
          <p-icon class="pi pi-plus"></p-icon>
          <span>Add Resume</span>
        </button>

        <app-import-existing-resume></app-import-existing-resume>
      </div>
    </div>

    @if (isActionInProgress) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    @if (!isActionInProgress && isResumeDownloadInProgress) {
      <div class="resume-download-progress" aria-live="polite">
        <div class="resume-download-progress__label">Downloading resume...</div>
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </div>
    }

    <div class="resume-body">
      <resume-list2
        [isActionInProgress]="isActionInProgress"
        (childEvent)="receiveFromChild($event)"
      ></resume-list2>
    </div>

    <div class="dashboard-footer">
      <app-work-ifence-footer></app-work-ifence-footer>
    </div>
  </div>
</div>
