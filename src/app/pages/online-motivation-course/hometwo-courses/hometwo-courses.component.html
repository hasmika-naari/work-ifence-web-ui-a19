<section
  class="courses-area pb-75"
  [class.dark-courses-area]="themeService.isDark()"
>
  <div class="container">
    <div
      class="section-title d-flex justify-content-between align-items-center"
      animateOnScroll
      animationClass="animate__fadeInDown"
      animationDelay="0.1s"
    >
      <div class="text-start">
        <span class="sub-title d-block">Discover</span>
        <h2 class="mb-0">Popular Courses</h2>
      </div>
    </div>

    <ul
      class="nav-tabset"
      animateOnScroll
      animationClass="animate__fadeIn"
      animationDelay="0.3s"
    >
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab2' }">
        <span (click)="switchTab($event, 'tab2')">Technology (02)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab3' }">
        <span (click)="switchTab($event, 'tab3')">Computer Science (05)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab4' }">
        <span (click)="switchTab($event, 'tab4')">Development (04)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab5' }">
        <span (click)="switchTab($event, 'tab5')">Language (02)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab6' }">
        <span (click)="switchTab($event, 'tab6')">Management (03)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab7' }">
        <span (click)="switchTab($event, 'tab7')">Photography (04)</span>
      </li>
      <li class="nav-tab" [ngClass]="{ 'active': currentTab === 'tab1' }">
        <span
          class="active all-courses"
          (click)="switchTab($event, 'tab1')"
          routerLink="/central/course-central/courses"
          >All Courses</span
        >
      </li>
    </ul>

    <div class="tabs-container">
      <ng-container *ngFor="let tab of ['tab1','tab2','tab3','tab4','tab5','tab6','tab7']">
        <div class="pane" *ngIf="currentTab === tab">
          <div class="row" animateOnScroll animationClass="animate__fadeIn" animationDelay="0.1s">
            <div
              class="col-lg-4 col-md-6"
              *ngFor="let course of getCoursesForTab(tab)"
            >
             <div class="single-courses-box mb-25">
                <div class="courses-image">
                    <a routerLink="/single-course" class="d-block">
                        <img [src]="course.image"  alt="image"></a>
                    <div class="courses-tag">
                        <a routerLink="/" class="d-block">{{course.subject}}</a>
                    </div>
                </div>
                <div class="courses-content">
                    <div class="course-author d-flex align-items-center">
                        <img [src]="course.instructorImage"  class="rounded-circle mr-2" alt="image">
                        <span>{{course.instructor}}</span>
                    </div>
                    <h3><a routerLink="/single-course" class="d-inline-block">
                        {{course.title}}
                    </a></h3>
                    <div class="courses-rating">
                        <div class="review-stars-rated">
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star-half'></i>
                        </div>
                        <div class="rating-total">
                            4.5 (2 rating)
                        </div>
                    </div>
                </div>
                <div class="courses-box-footer">
                    <ul>
                        <li class="students-number">
                             <button
                                    mat-icon-button
                                    [matMenuTriggerFor]="menu"
                                    [attr.aria-controls]="getMenuId(course)"
                                >
                                    <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu" yPosition="above" xPosition="after" [attr.id]="getMenuId(course)">
                                <button mat-menu-item (click)="share(course)">
                                <mat-icon>share</mat-icon>
                                <span>Share</span>
                                </button>
                                <button mat-menu-item (click)="viewDetails(course)">
                                <mat-icon>info</mat-icon>
                                <span>View Details</span>
                                </button>
                                <button mat-menu-item (click)="goToCourse(course)">
                                <mat-icon>open_in_new</mat-icon>
                                <span>Go to Course</span>
                                </button>
                            </mat-menu>
                        </li>
                        <li class="courses-lesson">
                            <!-- <i class='bx bx-book-open'></i> 10 lessons -->
                        </li>
                        <li class="courses-price">
                            FREE
                        </li>
                    </ul>
                </div>
            </div>

                class="single-courses-box mb-25"

      </ng-container>
    </div>
  </div>
</section>
