<section style="height: 100vh;overflow-y:scroll;">
    <app-header-wifence></app-header-wifence>
    <section>
        <div
                class="job-details-area pt-100 pb-70 pl-20 pr-20"
                [class.dark-job-details-area]="themeService.isDark()"  >
            <div class="container">
                <div class="course-list-header">
                    <div class="page-title-content">
                        <ul>
                            <li><a (click)="backToHomePage($event)">Home</a></li>
                            <li><a routerLink="/central/job-central">job-central</a></li>
                            <li>Job Details</li>
                        </ul>
                    </div>
                </div>
                <div class="job-details-header pt-50">
                    <div class="row align-items-center">
                        <div class="col-lg-12">
                            <div class="courses-title">
                                <h2 [innerHtml]="selectedJob.name"></h2>
                            </div>
                            <div class="courses-meta">
                                <ul>
                                    <li>
                                        <i class='bx bx-folder-open'></i>
                                        <span>Company</span>
                                        <a >{{selectedJob.company}}</a>
                                    </li>
                                    <li>
                                        <i class='bx bx-group'></i>
                                        <span>Job Type</span>
                                        <a >{{selectedJob.region}} - {{selectedJob.jobtype}}</a>
                                    </li>
                                    <li>
                                        <i class='bx bx-calendar'></i>
                                        <span>Date Posted</span>
                                        <a >{{convertDateFormat(selectedJob.pubdate)}}</a>
                                    </li>
                                    <li class="go-to-job-site" (click)="gotoJobSiteLink($event, selectedJob)">
                                        <i class='bx bx-link'></i>
                                        <span>Go To</span>
                                        <a >Job Site</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12" [innerHtml]="selectedJob.description">
                    
                    </div>
                </div>
            </div>
        </div>
    </section>
    <app-work-ifence-footer></app-work-ifence-footer>
</section>
