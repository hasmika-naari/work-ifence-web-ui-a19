<div id="loading-screen">
  <!-- Abstract SVG Background for profile/job theme -->
  <svg class="loading-bg-svg" width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
      <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#232946"/>
        <stop offset="100%" stop-color="#f05b45"/>
      </linearGradient>
      <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f05b45" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#232946" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    <circle cx="350" cy="200" r="180" fill="url(#circleGradient)"/>
    <circle cx="1600" cy="900" r="220" fill="url(#circleGradient)"/>
    <ellipse cx="1200" cy="300" rx="180" ry="80" fill="#f05b45" fill-opacity="0.08"/>
    <ellipse cx="600" cy="900" rx="220" ry="100" fill="#f05b45" fill-opacity="0.10"/>
    <rect x="1200" y="700" width="300" height="60" rx="30" fill="#fff" fill-opacity="0.07"/>
    <rect x="200" y="800" width="200" height="40" rx="20" fill="#fff" fill-opacity="0.07"/>
  </svg>
  <div class="loading-wrapper">
    <!-- File Animation -->
    <div class="file-stack">
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
    </div>
    <!-- Work iFence Logo Animation -->
    <div id="work-ifence-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="300" height="100" preserveAspectRatio="xMidYMid meet">
        <text x="50%" y="60" font-family="Poppins, sans-serif" font-size="40" fill="#ffffff" font-weight="bold" text-anchor="middle">Work iFence</text>
        <rect x="5" y="10" width="390" height="80" fill="none" stroke="#f05b45" stroke-width="4">
          <animate attributeName="stroke-dasharray" from="0,500" to="500,0" dur="2s" repeatCount="indefinite" />
        </rect>
      </svg>
    </div>
    <!-- Loading Text -->
    <p class="loading-text">Your personalized career dashboard<br><span class="loading-sub">Loading Please wait...</span></p>
  </div>
</div>
