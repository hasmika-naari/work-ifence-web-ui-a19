<div id="loading-screen">
  <!-- Glassmorphism AI mesh background -->
  <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;">
    <svg class="loading-bg-svg" width="100vw" height="100vh" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="blurGlass" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="60" />
      </filter>
      <radialGradient id="richBg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
        <stop offset="40%" stop-color="#f05b45" stop-opacity="0.18"/>
        <stop offset="70%" stop-color="#232946" stop-opacity="0.13"/>
        <stop offset="100%" stop-color="#232946" stop-opacity="0.09"/>
      </radialGradient>
      <linearGradient id="meshLine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f05b45"/>
        <stop offset="100%" stop-color="#232946"/>
      </linearGradient>
      <linearGradient id="geoGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f05b45" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#232946" stop-opacity="0.18"/>
      </linearGradient>
      <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
        <!-- Vignette gradient removed -->
      </radialGradient>
      <!-- Animated glowing dot -->
      <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f05b45" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#f05b45" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#richBg)"/>
    <!-- Removed dark vignette for smoother blend -->
    <!-- More mesh lines for density -->
    <path d="M0,120 Q480,320 960,120 T1920,120" stroke="url(#meshLine)" stroke-width="8" fill="none" opacity="0.38" style="filter:drop-shadow(0 0 18px #f05b45cc)"/>
    <path d="M0,320 Q480,520 960,320 T1920,320" stroke="url(#meshLine)" stroke-width="7" fill="none" opacity="0.32" style="filter:drop-shadow(0 0 16px #f05b45aa)"/>
    <path d="M0,540 Q480,740 960,540 T1920,540" stroke="url(#meshLine)" stroke-width="7" fill="none" opacity="0.28" style="filter:drop-shadow(0 0 16px #23294688)"/>
    <path d="M0,760 Q480,960 960,760 T1920,760" stroke="url(#meshLine)" stroke-width="7" fill="none" opacity="0.24" style="filter:drop-shadow(0 0 14px #f05b4588)"/>
    <path d="M0,900 Q480,1100 960,900 T1920,900" stroke="url(#meshLine)" stroke-width="7" fill="none" opacity="0.22" style="filter:drop-shadow(0 0 12px #f05b4588)"/>
    <!-- Animated glowing dots -->
    <circle cx="420" cy="340" r="32" fill="url(#glowDot)">
      <animate attributeName="r" values="32;44;32" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="900" r="24" fill="url(#glowDot)">
      <animate attributeName="r" values="24;36;24" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="18" fill="url(#glowDot)">
      <animate attributeName="r" values="18;28;18" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Abstract geometric shapes with stronger color -->
    <polygon points="300,200 500,350 400,500 200,350" fill="url(#geoGradient)" opacity="0.38" filter="url(#blurGlass)" style="filter:drop-shadow(0 0 32px #f05b45cc)"/>
    <polygon points="1600,800 1800,950 1700,1100 1500,950" fill="url(#geoGradient)" opacity="0.32" filter="url(#blurGlass)" style="filter:drop-shadow(0 0 32px #232946cc)"/>
    <!-- Futuristic grid accents -->
    <polyline points="200,800 400,900 600,850 800,950 1000,900 1200,950 1400,900 1600,950 1800,900" stroke="#f05b45" stroke-width="3" fill="none" opacity="0.18" style="filter:drop-shadow(0 0 12px #f05b45cc)"/>
    <polyline points="300,300 600,400 900,350 1200,400 1500,350 1800,400" stroke="#232946" stroke-width="2.5" fill="none" opacity="0.14" style="filter:drop-shadow(0 0 10px #232946cc)"/>
    <!-- Animated polygonal shapes -->
    <polygon points="900,200 1000,320 1100,200 1000,80" fill="#f05b45" opacity="0.13">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 200" to="360 1000 200" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1200,700 1300,820 1400,700 1300,580" fill="#232946" opacity="0.11">
      <animateTransform attributeName="transform" type="rotate" from="0 1300 700" to="360 1300 700" dur="7s" repeatCount="indefinite"/>
    </polygon>
  </svg>
  <!-- Glass panel for content -->
  <!-- Center box removed -->
  <div class="loading-wrapper" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(255,255,255,0.18);backdrop-filter:blur(32px);box-shadow:0 8px 32px 0 rgba(58,103,115,0.08);border-radius:24px;">
    <!-- File Animation -->
    <div class="file-stack">
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
      <div class="file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48px" height="48px">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5V9h5.5L13 3.5zM18 20H6V4h7v6h5v10z"/>
        </svg>
      </div>
    </div>
    <!-- Work iFence Logo Animation -->
    <div id="work-ifence-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="300" height="100" preserveAspectRatio="xMidYMid meet">
        <text x="50%" y="60" font-family="Poppins, sans-serif" font-size="40" fill="#fefefe" font-weight="bold" text-anchor="middle">Work iFence</text>
        <rect x="5" y="10" width="390" height="80" fill="none" stroke="#f05b45" stroke-width="4">
          <animate attributeName="stroke-dasharray" from="0,500" to="500,0" dur="2s" repeatCount="indefinite" />
        </rect>
      </svg>
    </div>
    <!-- Loading Text -->
    <p class="loading-text" style="color:#efefef;">Your personalized career dashboard<br><span class="loading-sub" style="color:#d8ecf1;">Loading Please wait...</span></p>
  </div>
</div>
