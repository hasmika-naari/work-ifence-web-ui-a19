<div
  class="d-flex"
    [ngClass]="{
        'blank-page': router.url.startsWith('/authentication'),
        'dark-theme': toggleService.isDark()
    }"
  >
  <!-- Sidebar -->
  <app-sidebar class="transition" [class.sidebar-mobile]="isMobile"
    [class.sidebar]="!isMobile"  [ngClass]="{'collapsed': isToggled}" />
  <!-- Portal container for submenu panel, ensures it renders above all content -->
  <div id="submenu-portal-container"></div>

    <!-- Main Content -->
      <div class="main-content transition d-flex flex-column flex-grow-1"><!-- Ensure no position: relative or overflow: hidden here to avoid submenu stacking issues -->
      <mat-sidenav-container autosize style="height: 100vh;"><!-- Removed overflow: hidden to fix submenu z-index -->
           <div class="right-sidenav-backdrop"
             *ngIf="rightSidenavOpen()"
             (click)="closeRightSidenav()"
             [@backdropFade]="rightSidenavOpen() ? 'open' : 'closed'"
             [attr.aria-hidden]="!rightSidenavOpen()"
             [attr.data-prefers-reduced-motion]="prefersReducedMotion ? 'true' : 'false'"
             tabindex="-1"
             aria-label="Close profile panel backdrop"
             role="presentation">
           </div>
           <mat-sidenav #menuSidenav position="end" mode="over" style="width: 300px; z-index: 1000 !important;"
            [@sidenavSlide]="rightSidenavOpen() ? 'open' : 'closed'"
            [attr.data-prefers-reduced-motion]="prefersReducedMotion ? 'true' : 'false'"
            tabindex="0"
            aria-label="Profile panel"
            role="dialog"
            [attr.aria-modal]="true"
            [attr.aria-hidden]="!rightSidenavOpen()">
            <div class="sidenav-header" style="display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem 1rem 1.5rem;">
              <img src="assets/img/logo.png" alt="Logo" style="height: 48px; width: auto; display: block;" />
              <button
                type="button"
                style="cursor:pointer;display:inline-flex;align-items:center;justify-content:center; margin-left: auto; background: transparent; border: 0; padding: 0;"
                (click)="closeMenuSidenav(menuSidenav)"
                aria-label="Close profile panel"
              >
                <lucide-icon name="X" size="24"></lucide-icon>
              </button>
            </div>

            <mat-divider></mat-divider>

            <div class="drawer-shell">
              <div class="drawer-scroll">
                <!-- Profiles list -->
                <div class="switch-profile-section" aria-label="Switch profile">
                  <div
                    class="sidebar-menu-grid profile-switch-grid"
                    [attr.aria-disabled]="profilePanelService.isSwitching ? true : null"
                    [attr.aria-busy]="profilePanelService.isSwitching ? true : null"
                  >
                    <button
                      *ngFor="let role of (profileRoles$ | async)"
                      type="button"
                      class="sidebar-menu-grid-item"
                      [class.active]="isActiveProfile(role)"
                      [disabled]="profilePanelService.isSwitching"
                      [attr.aria-disabled]="profilePanelService.isSwitching ? true : null"
                      (click)="onProfileItemActivate($event, role, menuSidenav)"
                      (keydown)="onProfileItemKeydown($event, role, menuSidenav)"
                    >
                      <lucide-icon class="profile-grid-icon" name="User" size="32"></lucide-icon>
                      <span class="sidebar-menu-grid-label">{{ profileLabel({ key: role }) }}</span>
                      <span class="profile-grid-spinner" *ngIf="profilePanelService.isSwitching && profilePanelService.switchingKey === role">
                        <mat-spinner diameter="18"></mat-spinner>
                      </span>
                    </button>
                  </div>
                </div>

                <mat-divider class="divider-spaced"></mat-divider>

                <!-- Actions (grid tiles) -->
                <div class="sidebar-menu-grid drawer-menu-grid" aria-label="Quick actions">
                  <a
                    class="sidebar-menu-grid-item"
                    routerLink="/help-center"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMenuSidenav(menuSidenav)"
                  >
                    <lucide-icon class="drawer-grid-icon" name="HelpCircle" size="32"></lucide-icon>
                    <span class="sidebar-menu-grid-label">Help Center</span>
                  </a>

                  <a
                    class="sidebar-menu-grid-item"
                    routerLink="/notifications"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMenuSidenav(menuSidenav)"
                  >
                    <lucide-icon class="drawer-grid-icon" name="Bell" size="32"></lucide-icon>
                    <span class="sidebar-menu-grid-label">Notifications</span>
                  </a>

                  <a
                    class="sidebar-menu-grid-item"
                    routerLink="/platform-info"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMenuSidenav(menuSidenav)"
                  >
                    <lucide-icon class="drawer-grid-icon" name="Info" size="32"></lucide-icon>
                    <span class="sidebar-menu-grid-label">Platform Info</span>
                  </a>

                  <a
                    *ngIf="accessContextService.activeProfileKey() === 'ROLE_ADMIN'"
                    class="sidebar-menu-grid-item"
                    routerLink="/user/menu-management"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMenuSidenav(menuSidenav)"
                  >
                    <lucide-icon class="drawer-grid-icon" name="Menu" size="32"></lucide-icon>
                    <span class="sidebar-menu-grid-label">Menu Management</span>
                  </a>
                </div>
              </div>

              <!-- Logout pinned at bottom -->
              <div class="drawer-bottom" aria-label="Logout">
                <div class="sidebar-menu-grid drawer-menu-grid drawer-bottom-grid">
                  <button
                    type="button"
                    class="sidebar-menu-grid-item logout"
                    (click)="logoutHandler($event); closeMenuSidenav(menuSidenav)"
                  >
                    <lucide-icon class="drawer-grid-icon" name="LogOut" size="32"></lucide-icon>
                    <span class="sidebar-menu-grid-label">Logout</span>
                  </button>
                </div>
              </div>
            </div>
       
          </mat-sidenav>
        <mat-sidenav-content style="height: 100vh; overflow-y: hidden;">
          <!-- Routed Content Section -->
          <app-header [isSticky]="isSticky" (openMenuSidenav)="openMenuSidenav(menuSidenav)" />

          <div class="content-wrapper flex-grow-1 p-3">
            <div #headerSentinel style="height: 1px; width: 100%;"></div>
            <router-outlet />
          </div>
        </mat-sidenav-content>
      </mat-sidenav-container>
      <!-- <app-footer /> -->
    </div>
  </div>
